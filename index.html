<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>Midnight - Page 4</title>

    <link rel="stylesheet" href="page4.css">
</head>

<body>

    <!-- ============================= -->
    <!-- PAGE 4 MAIN CONTAINER -->
    <!-- ============================= -->

    <main id="page4">

        <!-- ============================= -->
        <!-- PARTY FADING AWAY -->
        <!-- ============================= -->

        <section id="partyEnding" class="scene active">

            <div class="floating-balloon balloon-one"></div>
            <div class="floating-balloon balloon-two"></div>
            <div class="floating-balloon balloon-three"></div>

            <div class="party-sparkles">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
            </div>

            <div class="popup-container" id="partyPopup">

                <div class="story-popup">
                    <p id="partyText"></p>
                </div>

            </div>

        </section>


        <!-- ============================= -->
        <!-- BLACK SCREEN / DISCLAIMER -->
        <!-- ============================= -->

        <section id="blackScene" class="scene">

            <div class="black-story">

                <div class="time-label" id="storyTime">
                    12:32 AM
                </div>

                <p id="blackText"></p>

                <button id="blackContinue" class="continue-button">
                    Continue
                    <span>→</span>
                </button>

            </div>

        </section>


        <!-- ============================= -->
        <!-- MIDNIGHT BEDROOM -->
        <!-- ============================= -->

        <section id="bedroomScene" class="scene">

            <div class="moon"></div>

            <div class="window">
                <div class="window-frame"></div>

                <div class="window-stars">
                    <span>✦</span>
                    <span>✧</span>
                    <span>✦</span>
                    <span>✧</span>
                    <span>✦</span>
                    <span>✧</span>
                </div>
            </div>

            <div class="bedroom-glow"></div>

            <div class="bedroom-content">

                <div class="midnight-clock">
                    <span class="clock-dot"></span>
                    12:47 AM
                </div>

                <div class="wake-message">
                    Tisha is awake...
                </div>

                <div class="bedroom-title">
                    <h1>Midnight</h1>
                    <p>Everyone is gone. It's just the two of you now. 🌙</p>
                </div>

                <!-- Chat interface -->

                <div class="chat-wrapper">

                    <div class="chat-header">

                        <div class="profile-circle">
                            ❤️
                        </div>

                        <div class="profile-info">
                            <strong>Ritesh</strong>
                            <span>online • midnight</span>
                        </div>

                        <div class="header-moon">
                            🌙
                        </div>

                    </div>


                    <div id="chatMessages" class="chat-messages">

                        <!-- Messages added by JavaScript -->

                    </div>


                    <div id="typingIndicator" class="typing-indicator">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div id="chatBottom" class="chat-bottom">

                        <button id="runButton" class="run-button">
                            RUN TO HER
                            <span>❤️</span>
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- ============================= -->
        <!-- FINAL TRANSITION -->
        <!-- ============================= -->

        <section id="endingScene" class="scene">

            <div class="ending-content">

                <div class="heart-pulse">
                    ❤️
                </div>

                <p>
                    Ritesh couldn't keep his baby waiting...
                </p>

                <h2>
                    Cominggggggg! ❤️
                </h2>

                <button id="nextPageButton" class="continue-button">
                    Continue
                    <span>→</span>
                </button>

            </div>

        </section>

    </main>


    <script src="page4.js"></script>

</body>
</html>
