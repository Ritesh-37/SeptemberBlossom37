<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wake Up, Gorgeous ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    background:#170006;
    color:#fff;
}

body{
    position:relative;
}

#scene{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,rgba(155,0,30,.42),transparent 38%),
        radial-gradient(circle at 20% 80%,rgba(100,0,20,.45),transparent 40%),
        linear-gradient(135deg,#30000b,#720018 48%,#210006);
    transition:filter 1.5s ease,transform .2s ease;
}

#scene::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle,rgba(255,215,130,.08) 0 2px,transparent 3px);
    background-size:90px 90px;
    animation:particles 25s linear infinite;
    pointer-events:none;
}

@keyframes particles{
    from{transform:translateY(0)}
    to{transform:translateY(-90px)}
}

.vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.8) 100%);
    z-index:8;
}

.wake-box{
    position:relative;
    z-index:10;
    text-align:center;
    width:min(850px,90%);
}

.intro{
    opacity:0;
    transform:scale(.8);
    transition:all 1.4s cubic-bezier(.2,.8,.2,1);
}

.intro.visible{
    opacity:1;
    transform:scale(1);
}

.small{
    letter-spacing:5px;
    text-transform:uppercase;
    color:#e8bd70;
    font-size:.8rem;
    margin-bottom:18px;
}

h1{
    font-size:clamp(3rem,9vw,7.5rem);
    font-weight:400;
    line-height:.95;
    text-shadow:
        0 0 20px rgba(255,170,80,.25),
        0 8px 35px #000;
}

h1 span{
    color:#f5c97a;
    font-style:italic;
}

.sub{
    margin-top:25px;
    font-family:Arial,sans-serif;
    letter-spacing:2px;
    opacity:.8;
}

.tap-count{
    margin-top:45px;
    font-family:Arial,sans-serif;
    font-size:.75rem;
    letter-spacing:3px;
    color:#d9aa69;
}

#tapLayer{
    position:absolute;
    inset:0;
    z-index:20;
    cursor:pointer;
}

.tease{
    position:fixed;
    z-index:30;
    padding:13px 20px;
    border:1px solid rgba(255,220,150,.3);
    background:rgba(35,0,8,.6);
    backdrop-filter:blur(10px);
    border-radius:30px;
    color:#f7dba0;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    opacity:0;
    pointer-events:none;
    animation:floatIn 1s forwards, drift 4s ease-in-out infinite alternate;
}

@keyframes floatIn{
    from{opacity:0;transform:scale(.6)}
    to{opacity:1;transform:scale(1)}
}

@keyframes drift{
    from{margin-top:0}
    to{margin-top:-12px}
}

#start{
    position:absolute;
    bottom:7%;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    color:#eec477;
    font-family:Arial,sans-serif;
    font-size:.75rem;
    letter-spacing:4px;
    opacity:.8;
}

.shake{
    animation:shake .35s ease;
}

@keyframes shake{
    0%{transform:translate(0,0) rotate(0)}
    20%{transform:translate(-7px,3px) rotate(-.5deg)}
    40%{transform:translate(7px,-4px) rotate(.5deg)}
    60%{transform:translate(-5px,-2px) rotate(-.3deg)}
    80%{transform:translate(5px,3px) rotate(.3deg)}
    100%{transform:translate(0,0) rotate(0)}
}

.reverse-dizzy{
    animation:reverseDizzy 2.5s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes reverseDizzy{
    0%{
        transform:scale(2.4) rotate(13deg);
        filter:blur(18px);
    }
    35%{
        transform:scale(1.5) rotate(-8deg);
        filter:blur(10px);
    }
    65%{
        transform:scale(1.15) rotate(4deg);
        filter:blur(4px);
    }
    100%{
        transform:scale(1) rotate(0);
        filter:blur(0);
    }
}

.fade-out{
    animation:fadeOut 1.3s forwards;
}

@keyframes fadeOut{
    to{
        opacity:0;
        transform:scale(1.1);
        filter:blur(12px);
    }
}
</style>
</head>

<body>

<div id="scene" class="reverse-dizzy">

    <div class="wake-box">
        <div id="intro" class="intro">
            <div class="small">somebody needs to wake up</div>

            <h1>
                Wake up,<br>
                <span>gorgeous.</span>
            </h1>

            <div class="sub">
                I know you're pretending to sleep.
            </div>

            <div id="count" class="tap-count">
                TAP TO WAKE UP
            </div>
        </div>
    </div>

    <div class="vignette"></div>
</div>

<div id="tapLayer"></div>
<div id="start">✦ TAP ANYWHERE ✦</div>

<script>
const scene = document.getElementById("scene");
const intro = document.getElementById("intro");
const count = document.getElementById("count");
const tapLayer = document.getElementById("tapLayer");

let taps = 0;
let started = false;

const messages = [
    "There she is... 😏",
    "hmm... still sleepy? ♡",
    "come on, gorgeous ✦",
    "I know you're awake now...",
    "one more tap, troublemaker ♡",
    "pretty even half asleep.",
    "don't make me proud too quickly. 😏"
];

function sound(type="tap"){
    try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";

        if(type==="wake"){
            osc.frequency.setValueAtTime(180,ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(620,ctx.currentTime+1.2);
        }else{
            osc.frequency.setValueAtTime(240,ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(420,ctx.currentTime+.18);
        }

        gain.gain.setValueAtTime(.001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+.03);
        gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.7);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime+.75);
    }catch(e){}
}

window.addEventListener("load",()=>{
    setTimeout(()=>{
        intro.classList.add("visible");
        sound("wake");
    },2500);
});

tapLayer.addEventListener("click",()=>{
    if(!started){
        started=true;
    }

    taps++;

    scene.classList.remove("shake");
    void scene.offsetWidth;
    scene.classList.add("shake");

    sound();

    const visibility = Math.min(.35 + taps*.13,1);

    intro.style.opacity = visibility;

    const blur = Math.max(0,12 - taps*2.4);
    scene.style.filter = `blur(${blur}px)`;

    count.textContent =
        taps < 5
        ? `WAKE-UP LEVEL ${taps} / 5`
        : "FULLY AWAKE ♡";

    if(taps >= 5){
        scene.style.filter="blur(0)";
        intro.classList.add("visible");

        setTimeout(()=>{
            showTeases();
        },500);
    }
});

function showTeases(){

    const positions=[
        ["12%","18%"],
        ["70%","22%"],
        ["18%","68%"],
        ["68%","68%"],
        ["40%","12%"],
        ["42%","78%"],
        ["8%","43%"]
    ];

    messages.forEach((text,i)=>{
        setTimeout(()=>{
            const el=document.createElement("div");
            el.className="tease";
            el.textContent=text;

            el.style.left=positions[i][0];
            el.style.top=positions[i][1];

            document.body.appendChild(el);
        },i*650);
    });

    setTimeout(()=>{
        count.textContent="✦ LET'S GO ✦";

        setTimeout(()=>{
            scene.classList.add("fade-out");

            setTimeout(()=>{
                window.location.href="sevenwonder.html";
            },1300);

        },1800);

    },messages.length*650+1200);
}
</script>

</body>
</html>
